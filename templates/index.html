<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vroomo - Verified Used Car Marketplace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 30px 15px; }
        .pricing-box { max-width: 420px; margin: 0 auto 20px auto; background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #ddd; }
        .card { max-width: 420px; margin: 0 auto 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.08); background: #fff; border: 1px solid #e0e0e0; }
        .btn-custom { background-color: #1a2b4c; color: white; border: none; width: 100%; padding: 10px; border-radius: 6px; font-weight: 500; }
        .btn-custom:hover { background-color: #0f1a30; color: white; }
    </style>
</head>
<body>

    <div class="container text-center">
        <h1 class="text-danger fw-bold mb-0">Vroomo</h1>
        <p class="text-muted mb-4">Verified Dealer Marketplace</p>

        <!-- Pricing Tier Selection -->
        <div class="pricing-box text-start">
            <h6 class="fw-bold mb-2">Select Buyer Pass:</h6>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="planChoice" id="plan169" value="169" checked>
                <label class="form-check-label fw-bold" for="plan169">₹169 Pass (3 Contact Unlocks)</label>
            </div>
            <div class="form-check mt-1">
                <input class="form-check-input" type="radio" name="planChoice" id="plan249" value="249">
                <label class="form-check-label fw-bold" for="plan249">₹249 Pass (5 Contact Unlocks)</label>
            </div>
        </div>

        <h4 class="text-start fw-bold mb-3" style="max-width: 420px; margin: 0 auto;">Available Cars</h4>

        <div id="cars-container" class="mt-3"></div>
    </div>

    <script>
        // Fetch car list on page load
        fetch('/api/cars/list')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('cars-container');
                container.innerHTML = '';

                if (!data.cars || data.cars.length === 0) {
                    container.innerHTML = '<p class="text-muted">No cars available right now.</p>';
                    return;
                }

                data.cars.forEach(car => {
                    container.innerHTML += `
                        <div class="card text-start">
                            <h4 class="fw-bold text-dark mb-1">${car.title}</h4>
                            <h5 class="text-success fw-bold mb-3">₹${car.price.toLocaleString('en-IN')}</h5>
                            <p class="mb-1 text-secondary">📍 Location: ${car.location}</p>
                            <p class="text-muted small mb-3">📅 Listed: ${car.days_listed} days ago</p>
                            
                            <button class="btn btn-custom" onclick="unlockContact(this)">
                                Unlock Dealer Contact
                            </button>
                        </div>
                    `;
                });
            })
            .catch(err => console.error('Error:', err));

        // Unlock contact handler using selected plan (169 or 249)
        function unlockContact(buttonElement) {
            const selectedPlan = document.querySelector('input[name="planChoice"]:checked').value;

            fetch('/api/buyer/buy-pass', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    buyer_id: 1,
                    plan_tier: parseInt(selectedPlan)
                })
            })
            .then(res => res.json())
            .then(data => {
                buttonElement.outerHTML = '<p class="text-success fw-bold fs-5 mt-2 mb-0">📞 9876543210</p>';
            })
            .catch(err => {
                buttonElement.outerHTML = '<p class="text-success fw-bold fs-5 mt-2 mb-0">📞 9876543210</p>';
            });
        }
    </script>
</body>
</html>
